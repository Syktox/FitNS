name: Android Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

run-name: Build FitNS ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed release
    runs-on: ubuntu-latest

    steps:
      - name: Validate and export version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use the format vX.X.X, for example v0.0.1."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( 10#$minor > 999 || 10#$patch > 999 )); then
            echo "Minor and patch versions must be between 0 and 999."
            exit 1
          fi

          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is outside the supported range."
            exit 1
          fi

          echo "FITNS_VERSION_NAME=${major}.${minor}.${patch}" >> "${GITHUB_ENV}"
          echo "FITNS_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          required_secrets=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("${secret_name}")
            fi
          done

          if (( ${#missing_secrets[@]} > 0 )); then
            for secret_name in "${missing_secrets[@]}"; do
              echo "::error::Missing required GitHub Actions secret: ${secret_name}"
            done
            exit 1
          fi

          if [[ ! "${ANDROID_KEYSTORE_BASE64}" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid single-line Base64."
            exit 1
          fi

          release_keystore="${RUNNER_TEMP}/fitns-release-validation.jks"
          umask 077
          trap 'rm -f "${release_keystore}"' EXIT
          if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${release_keystore}"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded."
            exit 1
          fi
          if ! keytool -list \
            -keystore "${release_keystore}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" > /dev/null 2>&1; then
            echo "::error::The Android keystore, store password, or key alias is invalid."
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --max-workers=1

      - name: Run release lint
        run: ./gradlew --no-daemon lintRelease --max-workers=1

      - name: Build APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease --max-workers=1

      - name: Verify signed release artifacts
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob

          apks=(app/build/outputs/apk/release/*.apk)
          bundles=(app/build/outputs/bundle/release/*.aab)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APK was produced."
            exit 1
          fi
          if (( ${#bundles[@]} == 0 )); then
            echo "::error::No release AAB was produced."
            exit 1
          fi

          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${android_sdk_root}" || ! -d "${android_sdk_root}/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi

          apksigner_path="$(
            find "${android_sdk_root}/build-tools" -mindepth 2 -maxdepth 2 \
              -type f -name apksigner -print | sort -V | tail -n 1
          )"
          if [[ -z "${apksigner_path}" || ! -x "${apksigner_path}" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            "${apksigner_path}" verify --verbose "${apk}"
            echo "Verified signed APK: ${apk##*/}"
          done

          for bundle in "${bundles[@]}"; do
            verification_output="$(jarsigner -verify "${bundle}" 2>&1)"
            if ! grep -Fq "jar verified." <<< "${verification_output}" || \
              grep -Eqi "jar is unsigned|unsigned entries" <<< "${verification_output}"; then
              printf '%s\n' "${verification_output}"
              echo "::error::AAB signature verification failed for ${bundle##*/}."
              exit 1
            fi
            echo "Verified signed AAB: ${bundle##*/}"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitns-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FitNS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
