name: Android CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug sources
        run: ./gradlew --no-daemon compileDebugKotlin --max-workers=1

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --max-workers=1

      - name: Run lint
        run: ./gradlew --no-daemon lint --max-workers=1

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --max-workers=1
